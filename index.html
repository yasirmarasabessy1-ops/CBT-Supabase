function mView(u, secret) {

  if (secret) { o.token = u.token; o.token_updated_at = u.token_updated_at; }

}
function mRotate() { M.ujian.forEach(u => { if (u.status === 'Aktif' && Date.now() - new Date(u.token_updated_at).getTime() > 300000) { u.token = rndToken(); u.token_updated_at = new Date().toISOString(); } }); }
function mAuth(c, role) { const u = M.users.find(x => x.username === c.u && x._pw === c.p); if (!u || (role && u.role !== role)) throw new Error('Akses ditolak'); return u; }
function mCascade(table, id) {
  if (table === 'kelas') { M.users.forEach(u => { if (u.kelas_id === id) u.kelas_id = null; }); M.ujian = M.ujian.filter(x => x.kelas_id !== id); }
  if (table === 'users') { M.ruang_siswa = M.ruang_siswa.filter(x => x.siswa_id !== id); M.ruang_pengawas = M.ruang_pengawas.filter(x => x.pengawas_id !== id); }
  if (table === 'ruang') { M.ruang_siswa = M.ruang_siswa.filter(x => x.ruang_id !== id); M.ruang_pengawas = M.ruang_pengawas.filter(x => x.ruang_id !== id); }
  if (table === 'sesi') { M.ujian = M.ujian.filter(x => x.sesi_id !== id); M.ruang_pengawas = M.ruang_pengawas.filter(x => x.sesi_id !== id); }

let sb = null;
const L = {

  async loadAll() {

/* =====================================================================
   PWA (manifest data URI di <head>, Service Worker dibuat dari Blob)
===================================================================== */
function setupPWA() {
  try { const mf = document.querySelector('link[rel="manifest"]'); if (mf && !document.head.contains(mf)) document.head.appendChild(mf.cloneNode()); const mt = document.querySelector('meta[name="theme-color"]'); if (mt && !document.head.contains(mt)) document.head.appendChild(mt.cloneNode()); } catch (e) {}
  try {
    const sw = "const C='cbt-v1';self.addEventListener('install',e=>{self.skipWaiting()});self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim())});self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).then(r=>{const c=r.clone();if(r.ok&&e.request.url.startsWith('http'))caches.open(C).then(x=>x.put(e.request,c)).catch(()=>{});return r}).catch(()=>caches.match(e.request)))});";
    const url = URL.createObjectURL(new Blob([sw], { type: 'text/javascript' }));
    if ('serviceWorker' in navigator) navigator.serviceWorker.register(url).catch(() => {});
  } catch (e) {}
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; if (S.role) render(); });
}

const VIOL_LABEL = { fullscreen_keluar: 'Keluar dari layar penuh', pindah_tab: 'Berpindah tab / aplikasi', jendela_blur: 'Jendela kehilangan fokus', devtools: 'Terdeteksi developer tools', shortcut: 'Menekan tombol terlarang', salin_tempel: 'Menyalin / menempel', screenshot: 'Mencoba screenshot', tombol_kembali: 'Menekan tombol kembali', reload: 'Memuat ulang halaman' };

function monState(r) { if (r.selesai) return 'selesai'; if (r.terkunci) return 'terkunci'; if (r.last_seen && now() - new Date(r.last_seen).getTime() < 45000) return 'aktif'; if (r.mulai_at) return 'offline'; return 'belum'; }

    return `<tr><td class="font-semibold">${esc(r.nama)}<div class="text-[11px] text-slate-400">${esc(r.username)}</div></td><td>${esc(r.ruang)}</td><td><span class="badge ${b[1]}">${b[0]}</span></td>

function wmUrl(text) {
  const t = String(text).replace(/[<>&"']/g, '');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="170"><text x="150" y="90" text-anchor="middle" transform="rotate(-24 150 85)" font-family="Arial" font-size="15" font-weight="700" fill="rgba(79,70,229,0.16)">${t}</text></svg>`;
  return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
}
const ovBox = (emoji, title, text, extra = '') => `<div class="glass-strong rounded-3xl p-7 max-w-md text-center mx-4"><div class="text-5xl mb-3">${emoji}</div><h3 class="text-2xl font-extrabold text-slate-800 mb-2">${title}</h3><p class="text-slate-600 text-sm mb-5">${text}</p>${extra}</div>`;
function roomOv(html, kind) { const o = $('room-ov'); if (!o || !S.room) return; S.room.ovKind = kind; o.innerHTML = html; o.style.display = 'flex'; icons(); }
function roomOvHide() { const o = $('room-ov'); if (o) { o.style.display = 'none'; o.innerHTML = ''; } if (S.room) { clearInterval(S.room.warnT); S.room.ovKind = null; } }
function roomHdr() { const R = S.room, el = $('room-viol'); if (!R || !el) return; el.textContent = `Pelanggaran ${R.count}/${R.maks}`; el.style.color = R.count ? '#dc2626' : '#64748b'; }
function showNeedFs() { const R = S.room; if (!R || R.over || R.locked) return; roomOv(ovBox('🖥️', 'Layar Penuh Wajib', 'Ujian hanya dapat dikerjakan dalam mode layar penuh. Klik tombol di bawah untuk melanjutkan.', '<button class="btn btn-p w-full" onclick="A.roomFs()">Masuk Layar Penuh</button>'), 'fs'); }
function showLock() { const R = S.room; if (!R || R.over) return; clearInterval(R.warnT); roomOv(ovBox('🔒', 'Ujian Terkunci', 'Anda melakukan pelanggaran melebihi batas yang diizinkan dan telah dilaporkan ke pengawas. Hubungi pengawas untuk membuka kunci. Halaman ini otomatis dilanjutkan setelah kunci dibuka.', '<button class="btn btn-g w-full" onclick="A.closeRoom()">Keluar dari Ruang Ujian</button>'), 'lock'); roomHdr(); }
function showWarn(jenis) {
  const R = S.room; if (!R || R.over) return;
  if (R.locked || R.count >= R.maks) { R.locked = true; showLock(); return; }
  let sec = 5;
  const draw = () => roomOv(ovBox('⚠️', 'Pelanggaran Terdeteksi', `<b>${esc(VIOL_LABEL[jenis] || jenis)}</b><br>Pelanggaran <b>${R.count} dari ${R.maks}</b>. Pada pelanggaran ke-${R.maks}, ujian Anda akan <b>terkunci</b> dan dilaporkan ke pengawas.`,
    `<button class="btn btn-p w-full" ${sec > 0 ? 'disabled style="opacity:.5"' : ''} onclick="A.roomAck()">${sec > 0 ? 'Harap tunggu ' + sec + ' detik' : 'Saya Mengerti, Lanjutkan'}</button>`), 'warn');
  draw(); clearInterval(R.warnT); R.warnT = setInterval(() => { sec--; if (sec <= 0) clearInterval(R.warnT); if (S.room && S.room.ovKind === 'warn') draw(); }, 1000); roomHdr();
}
function roomCleanup() {
  const R = S.room; if (!R) return;
  clearInterval(R.t1); clearInterval(R.t2); clearInterval(R.t3); clearInterval(R.warnT);
  (R.cleanups || []).forEach(f => { try { f(); } catch (e) {} }); R.cleanups = [];
  leaveFs();
}
function startRoom(ex, link, endAt, opt = {}) {
  const R = S.room = { ex, link, endAt: new Date(endAt).getTime(), over: false, sid: opt.sid || newSid(), count: opt.count || 0, maks: opt.maks || S.settings.maks_pelanggaran || 3, locked: !!opt.locked, lastV: 0, t0: Date.now(), cleanups: [], ovKind: null };
  sessionStorage.setItem('cbt_room', JSON.stringify({ id: ex.id, mapel: ex.mapel, link, end: endAt, sid: R.sid }));
  const el = document.createElement('div'); el.id = 'room'; el.className = 'noselect';
  el.style.cssText = 'position:fixed;inset:0;z-index:70;background:#fff;display:flex;flex-direction:column';
  el.innerHTML = `<div class="glass-strong flex items-center justify-between gap-3 px-4 py-2.5" style="border-radius:0 0 1rem 1rem;z-index:2"><div class="min-w-0"><div class="font-extrabold text-indigo-900 truncate">${esc(ex.mapel)}</div><div class="text-[11px] text-slate-500 truncate">${esc(S.user.nama)} • ${esc(S.user.kelas || '')} • <b id="room-viol">Pelanggaran 0/3</b></div></div>
    <div class="flex items-center gap-3"><div class="text-center"><div class="text-[10px] font-bold uppercase text-slate-400">Sisa Waktu</div><div id="room-timer" class="font-mono font-extrabold text-xl text-indigo-700">--:--:--</div></div><button class="btn btn-d btn-sm" onclick="A.finishExam()">Selesai</button></div></div>
    <div id="room-body" style="flex:1;position:relative;overflow:hidden"><iframe id="room-frame" src="${esc(link)}" sandbox="allow-scripts allow-forms allow-same-origin allow-modals" referrerpolicy="no-referrer" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="fullscreen"></iframe>
      <div style="position:absolute;inset:0;pointer-events:none;z-index:3;background-image:${wmUrl(S.user.nama + ' • ' + S.user.username)};background-repeat:repeat"></div></div>
    <div id="room-ov" style="display:none;position:absolute;inset:0;z-index:9;background:rgba(255,255,255,.98);align-items:center;justify-content:center;padding:16px"></div>`;
  $('cbt-root').appendChild(el); roomHdr();

  const on = (t, ev, fn, o) => { t.addEventListener(ev, fn, o); R.cleanups.push(() => t.removeEventListener(ev, fn, o)); };
  const violate = (jenis, detail = '') => {
    if (R.over || Date.now() - R.t0 < 2500 || Date.now() - R.lastV < 3000) return;
    R.lastV = Date.now(); R.count++; showWarn(jenis);
    API.logViolation(S.cred, ex.id, R.sid, jenis, detail).then(r => {
      if (!r || R.over) return;
      if (r.duplicate) { timeUp('Sesi Ganda / Direset', 'Ujian ini dibuka di perangkat lain atau sesi Anda direset oleh pengawas.'); return; }
      R.count = r.pelanggaran; R.maks = r.maks; roomHdr();
      if (r.terkunci && !R.locked) { R.locked = true; showLock(); }
    }).catch(() => {});
  };
  R.violate = violate;

  // --- Deteksi keluar dari fokus ujian ---
  on(document, 'visibilitychange', () => { if (document.hidden) violate('pindah_tab'); });
  on(window, 'blur', () => setTimeout(() => { const f = $('room-frame'); if (R.over) return; if (document.activeElement === f) return; if (!document.hasFocus()) violate('jendela_blur'); }, 200));
  if (FS_OK) { on(document, 'fullscreenchange', () => { if (!isFs() && !R.over) violate('fullscreen_keluar'); }); on(document, 'webkitfullscreenchange', () => { if (!isFs() && !R.over) violate('fullscreen_keluar'); }); }
  // --- Blokir aksi terlarang di halaman induk ---
  ['contextmenu', 'selectstart', 'dragstart'].forEach(ev => on(document, ev, e => { e.preventDefault(); }));
  ['copy', 'cut', 'paste'].forEach(ev => on(document, ev, e => { e.preventDefault(); violate('salin_tempel', ev); }));
  on(document, 'keydown', e => {
    const k = e.key || '', c = e.ctrlKey || e.metaKey;
    if (k === 'F12' || k === 'F5' || (c && e.shiftKey && /^[ijckIJCK]$/.test(k)) || (c && /^[uUsSpPaAcCvVxXrRfF]$/.test(k))) { e.preventDefault(); e.stopPropagation(); violate('shortcut', k); }
  }, true);
  on(document, 'keyup', e => { if (e.key === 'PrintScreen') { try { navigator.clipboard.writeText('Dilarang menyalin soal ujian'); } catch (x) {} violate('screenshot'); } });
  on(window, 'beforeunload', e => { e.preventDefault(); e.returnValue = ''; });
  try { history.pushState(null, '', location.href); } catch (x) {}
  on(window, 'popstate', () => { try { history.pushState(null, '', location.href); } catch (x) {} violate('tombol_kembali'); });
  on(window, 'offline', () => toast('Koneksi terputus. Jawaban yang belum terkirim mungkin gagal tersimpan.', 'warn'));
  // --- Heuristik developer tools (hanya desktop, saat layar penuh) ---
  R.t3 = setInterval(() => { if (R.over || COARSE || !isFs()) return; if (window.outerWidth - window.innerWidth > 220 || window.outerHeight - window.innerHeight > 220) violate('devtools'); }, 2500);

  // --- Timer ---
  const tick = () => {
    const left = R.endAt - now(); const t = $('room-timer'); if (!t) return;
    t.textContent = fmtDur(left); t.style.color = left < 300000 ? '#dc2626' : '#4338ca';
    if (left <= 0) timeUp('Waktu Habis!', 'Waktu ujian telah berakhir. Jawaban Anda sudah tidak dapat diubah.');
  };
  R.t1 = setInterval(tick, 1000); tick();
  // --- Detak jantung ke server (sesi ganda, kunci, perpanjangan, akhir ujian) ---
  R.t2 = setInterval(async () => {
    try {
      const st = await API.examState(S.cred, ex.id, R.sid); sync(st.server_now); if (R.over) return;
      R.endAt = new Date(st.end_at).getTime();
      if (st.duplicate) { timeUp('Sesi Ganda / Direset', 'Ujian ini dibuka di perangkat lain atau sesi Anda direset oleh pengawas.'); return; }
      if (st.status !== 'Aktif') { timeUp('Ujian Diakhiri', 'Ujian telah diakhiri oleh pengawas.'); return; }
      R.maks = st.maks; R.count = st.pelanggaran; roomHdr();
      if (st.terkunci && !R.locked) { R.locked = true; showLock(); }
      else if (!st.terkunci && R.locked) { R.locked = false; roomOv(ovBox('🔓', 'Kunci Dibuka', 'Pengawas telah membuka kunci ujian Anda. Pelanggaran berikutnya akan langsung mengunci kembali.', '<button class="btn btn-p w-full" onclick="A.roomAck()">Lanjutkan Ujian</button>'), 'warn'); }
    } catch (e) {}
  }, 10000);

  // --- Awal masuk ---
  if (R.locked) showLock();
  else if (FS_OK && !isFs()) { goFs().then(() => { if (!isFs() && S.room === R && !R.ovKind) showNeedFs(); }); }
  if (opt.restored) { R.t0 = Date.now() - 3000; violate('reload'); }
}
function timeUp(title, text) {
  const R = S.room; if (!R || R.over) return; R.over = true; roomCleanup(); roomOvHide();
  const b = $('room-body'); if (b) b.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center"><div class="glass-strong rounded-3xl p-8 max-w-md"><div class="text-5xl mb-3">⏰</div><h3 class="text-3xl font-extrabold text-slate-800 mb-2">${esc(title)}</h3><p class="text-slate-600 mb-5">${esc(text)}</p><button class="btn btn-p" onclick="A.closeRoom()">Kembali ke Beranda</button></div></div>`;
}
function closeRoom(silent) {
  roomCleanup(); S.room = null; sessionStorage.removeItem('cbt_room');
  const el = $('room'); if (el) el.remove();
  if (!silent) A.go('s_ujian');
}

function tickTokens() {
  document.querySelectorAll('.tk-count').forEach(el => { const left = Number(el.dataset.until) - now(); el.textContent = left > 0 ? fmtDur(left).slice(3) : '00:00'; });
}
async function refresh() { S.data = await API.loadAll(); }
async function loadRole() {
  clearInterval(S.poll);
  if (S.role === 'admin') { await refresh(); }
  else if (S.role === 'pengawas') { S.pw = await API.getPengawas(S.cred); sync(S.pw.server_now); S.poll = setInterval(async () => { try { if (S.role === 'pengawas' && S.page === 'p_jadwal' && !$('modal').innerHTML) { S.pw = await API.getPengawas(S.cred); sync(S.pw.server_now); render(); } } catch (e) {} }, 20000); }
  else if (S.role === 'siswa') { S.sw = await API.getExams(S.cred); sync(S.sw.server_now); S.poll = setInterval(async () => { try { if (S.role === 'siswa' && S.page === 's_ujian' && !S.room) { S.sw = await API.getExams(S.cred); sync(S.sw.server_now); render(); } } catch (e) {} }, 30000); }
}

  async addRuangPengawas(ev) {
    ev.preventDefault();
    await run(async () => { await API.ins('ruang_pengawas', { ruang_id: $('f-rp-ruang').value, sesi_id: $('f-rp-sesi').value, pengawas_id: $('f-rp-pw').value, tanggal: $('f-rp-tgl').value }); await refresh(); render(); toast('Penugasan disimpan.'); }); return false;
  },
  cetakSiswaRuang(rid) {
    const d = S.data, rs = d.ruang.filter(r => !rid || r.id === rid);
    const body = rs.map(r => { const sis = d.ruang_siswa.filter(x => x.ruang_id === r.id).map(x => byId(d.users, x.siswa_id)).filter(Boolean).sort((a, b) => a.nama.localeCompare(b.nama));
      return `<div class="ruang"><div class="kop"><h2>${esc(S.settings.nama_sekolah)}</h2><div>${esc(S.settings.alamat)}</div></div><h3 style="text-align:center">DAFTAR PESERTA UJIAN - ${esc(r.nama_ruang).toUpperCase()}</h3><table><thead><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Username</th><th>Tanda Tangan</th></tr></thead><tbody>${sis.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.nama)}</td><td>${esc(kName(s.kelas_id))}</td><td>${esc(s.username)}</td><td style="width:140px"></td></tr>`).join('') || '<tr><td colspan="5">Belum ada siswa</td></tr>'}</tbody></table></div>`; }).join('');
    printDoc('Daftar Siswa per Ruang', body);
  },
  cetakPengawas() {
    const d = S.data, rows = d.ruang_pengawas.slice().sort((a, b) => String(a.tanggal).localeCompare(String(b.tanggal)));
    printDoc('Jadwal Pengawas', `<div class="kop"><h2>${esc(S.settings.nama_sekolah)}</h2><div>${esc(S.settings.alamat)}</div></div><h3 style="text-align:center">JADWAL TUGAS PENGAWAS UJIAN</h3><table><thead><tr><th>No</th><th>Tanggal</th><th>Sesi</th><th>Jam</th><th>Ruang</th><th>Pengawas</th></tr></thead><tbody>${rows.map((r, i) => { const s = byId(d.sesi, r.sesi_id) || {}; return `<tr><td>${i + 1}</td><td>${fmtDate(r.tanggal)}</td><td>${esc(s.nama_sesi || '')}</td><td>${hhmm(s.jam_mulai)}-${hhmm(s.jam_berakhir)}</td><td>${esc((byId(d.ruang, r.ruang_id) || {}).nama_ruang || '')}</td><td>${esc(uName(r.pengawas_id))}</td></tr>`; }).join('') || '<tr><td colspan="6">Belum ada penugasan</td></tr>'}</tbody></table>`);
  },

  async saveUjian(ev) {
    ev.preventDefault();
    const row = { kelas_id: $('f-uj-kls').value, mapel: $('f-uj-map').value.trim(), tanggal: $('f-uj-tgl').value, sesi_id: $('f-uj-sesi').value, link: $('f-uj-link').value.trim() };
    await run(async () => {
      if (S.editUjian) { await API.upd('ujian', S.editUjian, row); toast('Jadwal diperbarui.'); }
      else { await API.ins('ujian', { ...row, token: rndToken() }); toast('Jadwal disimpan.'); }
      S.editUjian = null; await refresh(); render();
    }); return false;
  },
  editUjian(id) { S.editUjian = id; render(); $('cbt-root').scrollTo({ top: 0, behavior: 'smooth' }); },
  resetUjian() { S.editUjian = null; render(); },
  async tokenManual(id) { await run(async () => { await API.upd('ujian', id, { token: rndToken(), token_updated_at: new Date().toISOString() }); await refresh(); render(); toast('Token diperbarui.'); }); },
  async toggleStatus(id) { const u = byId(S.data.ujian, id); await run(async () => { await API.upd('ujian', id, { status: u.status === 'Aktif' ? 'Selesai' : 'Aktif', token_updated_at: new Date().toISOString() }); await refresh(); render(); toast('Status diperbarui.'); }); },

  logoFile(inp) {
    const f = inp.files[0]; if (!f) return;
    const img = new Image(), rd = new FileReader();
    rd.onload = e => { img.onload = () => { const m = 200, r = Math.min(1, m / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); $('st-logo').value = c.toDataURL('image/png'); $('st-logo-prev').innerHTML = `<img src="${$('st-logo').value}" style="width:56px;height:56px;object-fit:contain;border-radius:10px">`; }; img.src = e.target.result; };
    rd.readAsDataURL(f);
  },
  logoClear() { $('st-logo').value = ''; $('st-logo-prev').innerHTML = '<div style="width:56px;height:56px" class="rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 text-xs">Kosong</div>'; },
  async saveSettings(ev) {
    ev.preventDefault();
    const s = { nama_app: $('st-app').value.trim(), nama_sekolah: $('st-sch').value.trim(), alamat: $('st-alm').value.trim(), logo: $('st-logo').value, zona_waktu: $('st-tz').value, maks_pelanggaran: Math.min(10, Math.max(1, parseInt($('st-mx').value, 10) || 3)) };
    await run(async () => { await API.saveSettings(s); S.settings = { ...S.settings, ...s }; document.title = s.nama_app; render(); toast('Pengaturan disimpan.'); }); return false;
  },

  async pNewToken(id) { await run(async () => { const r = await API.newToken(S.cred, id); if (!r.success) throw new Error(r.message); S.pw = await API.getPengawas(S.cred); sync(S.pw.server_now); render(); toast('Token baru: ' + r.token); }); },
  async pExtend(id) {
    const v = await ask({ title: 'Tambah Waktu', text: 'Berapa menit waktu ujian ingin ditambahkan? (1-180)', input: { type: 'number', value: '15' }, ok: 'Tambah' });
    const m = parseInt(v, 10); if (!v || !(m > 0)) return;
    await run(async () => { await API.extend(S.cred, id, m); S.pw = await API.getPengawas(S.cred); sync(S.pw.server_now); render(); toast(`Waktu ditambah ${Math.min(m, 180)} menit.`); });
  },
  async pEnd(id) {
    if (!(await ask({ title: 'Akhiri Ujian?', text: 'Semua peserta akan otomatis keluar dari ruang ujian. Tindakan ini tidak bisa dibatalkan oleh pengawas.', ok: 'Akhiri Ujian', danger: true }))) return;
    await run(async () => { await API.endExam(S.cred, id); S.pw = await API.getPengawas(S.cred); sync(S.pw.server_now); render(); toast('Ujian diakhiri.'); });
  },

  async prepareExam(id) {
    const u = ((S.sw && S.sw.exams) || []).find(x => x.id === id); if (!u) return;
    const v = await ask({ title: u.mapel, text: 'Masukkan <b>token ujian</b> dari pengawas:', input: { type: 'tel', placeholder: '5 digit token' }, ok: 'Masuk Ruang Ujian' });
    if (!v) return;
    await run(async () => {
      const sid = newSid();
      const r = await API.checkToken(S.cred, id, v, sid);
      if (!r.success) { toast(r.message, 'err'); return; }
      sync(r.server_now); startRoom(u, r.link, r.end_at, { sid });
    }, 'Memeriksa token...');
  },
  async finishExam() {
    const R = S.room; if (!R) return;
    if (R.over) { closeRoom(); return; }
    if (await ask({ title: 'Selesai Ujian?', text: 'Pastikan Anda sudah mengirim (submit) jawaban pada formulir. Setelah keluar, Anda <b>tidak dapat masuk kembali</b> ke ujian ini kecuali diizinkan pengawas.', ok: 'Ya, Selesai', danger: true })) {
      await run(async () => { try { await API.finishExam(S.cred, R.ex.id, R.sid); } catch (e) {} });
      closeRoom();
    }
  },
  roomAck() { roomOvHide(); if (FS_OK && !isFs()) goFs(); },
  roomFs() { goFs().then(() => { if (isFs() || !FS_OK) roomOvHide(); }); },
  closeRoom,

  /* ---- Monitoring ---- */
  pMon(id) { S.monId = id; A.go('p_monitor'); },
  monSelect(id) { S.monId = id; S.mon = null; const el = $('mon-table'); if (el) el.innerHTML = monTable(); A.loadMon(); },
  async loadMon(silent) {
    if (!S.monId) return;
    const f = async () => { S.mon = await API.getMonitor(S.role === 'admin' ? null : S.cred, S.monId); sync(S.mon.server_now); const el = $('mon-table'); if (el) { el.innerHTML = monTable(); icons(); } };
    if (silent) { try { await f(); } catch (e) {} } else await run(f, 'Memuat...');
  },
  async monAct(siswaId, aksi) {
    const txt = { buka_kunci: 'Buka kunci siswa ini? Pelanggaran berikutnya akan langsung mengunci kembali.', masuk_ulang: 'Izinkan siswa ini masuk ulang (misalnya setelah pindah perangkat)? Siswa perlu memasukkan token lagi.', reset: 'Reset seluruh status dan riwayat pelanggaran siswa ini pada ujian ini?' }[aksi];
    if (!(await ask({ title: 'Konfirmasi', text: txt, ok: 'Ya, Lanjutkan', danger: aksi === 'reset' }))) return;
    await run(async () => { await API.monitorAction(S.role === 'admin' ? null : S.cred, S.monId, siswaId, aksi); await A.loadMon(true); toast('Berhasil diperbarui.'); });
  },
  monDetail(siswaId) {
    const r = S.mon && S.mon.rows.find(x => x.siswa_id === siswaId); if (!r) return;
    openModal(`<h3 class="text-lg font-bold mb-1">Riwayat Pelanggaran</h3><p class="text-sm text-slate-500 mb-3">${esc(r.nama)} (${r.pelanggaran}/${S.mon.maks})</p>${!r.riwayat.length ? empty('Tidak ada catatan.') : `<div class="space-y-2">${r.riwayat.map(x => `<div class="flex justify-between gap-3 p-2.5 rounded-xl bg-red-50 text-sm"><span class="font-semibold text-red-700">${esc(VIOL_LABEL[x.jenis] || x.jenis)}${x.detail ? ' <span class="text-red-400">(' + esc(x.detail) + ')</span>' : ''}</span><span class="text-xs text-slate-500 whitespace-nowrap">${new Date(x.waktu).toLocaleTimeString('id-ID')}</span></div>`).join('')}</div>`}<div class="flex justify-end mt-4"><button class="btn btn-p" onclick="document.getElementById('modal').style.display='none';document.getElementById('modal').innerHTML=''">Tutup</button></div>`);
  }
};

/* =====================================================================
   BOOT
===================================================================== */
async function boot() {
  document.title = S.settings.nama_app;
  setupPWA();
  render();
  if (!IS_PREVIEW) {
    if (SUPABASE_URL.includes('URL_SUPABASE') || SUPABASE_ANON_KEY.includes('ANON_KEY')) { $('app').innerHTML = `<div class="min-h-screen flex items-center justify-center p-6"><div class="glass-strong rounded-3xl p-8 max-w-md text-center"><div class="text-4xl mb-3">⚙️</div><h2 class="text-xl font-extrabold mb-2">Konfigurasi Belum Lengkap</h2><p class="text-sm text-slate-600">Isi <b>SUPABASE_URL</b> dan <b>SUPABASE_ANON_KEY</b> pada bagian KONFIGURASI APLIKASI di kode.</p></div></div>`; return; }
    sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    API = L;
  }
  await run(async () => {
    await autoSetupDatabase();
    try { const s = await API.getSettings(); if (s) S.settings = { ...S.settings, ...s }; document.title = S.settings.nama_app; } catch (e) { console.warn(e); }
    // pulihkan sesi
    let restored = false;
    try {
      if (!IS_PREVIEW) { const au = await API.adminSession(); if (au) { await enter('admin', { nama: 'Administrator', username: au.email }, null); restored = true; } }
      const ss = sessionStorage.getItem('cbt_sess');
      if (!restored && ss) {
        const { cred, user } = JSON.parse(ss); const r = await API.loginUser(cred.u, cred.p);
        if (r && r.success) {
          await enter(r.user.role, r.user, cred); restored = true;
          const rm = JSON.parse(sessionStorage.getItem('cbt_room') || 'null');
          if (rm && r.user.role === 'siswa' && new Date(rm.end).getTime() > now()) {
            const ex = ((S.sw && S.sw.exams) || []).find(x => x.id === rm.id);
            if (ex) { const st = await API.examState(S.cred, rm.id, rm.sid); sync(st.server_now); if (st.status === 'Aktif' && !st.duplicate && !st.selesai) startRoom(ex, rm.link, st.end_at, { sid: rm.sid, restored: true, count: st.pelanggaran, maks: st.maks, locked: st.terkunci }); else sessionStorage.removeItem('cbt_room'); }
          }
        }
      }
    } catch (e) { console.warn(e); sessionStorage.removeItem('cbt_sess'); }
    if (!restored) render(); else icons();
  }, 'Menyiapkan aplikasi...');
}
boot();
</script>
